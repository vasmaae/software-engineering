server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $sgt_api api:8080;
        proxy_pass http://$sgt_api;
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
