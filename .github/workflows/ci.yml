name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      stage:
        description: Завершённый этап для снимка метрик
        required: true
        type: choice
        options: [SGT-14, SGT-15, SGT-16, SGT-17, SGT-18, SGT-19, SGT-20]

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: sgt_test
          POSTGRES_USER: sgt
          POSTGRES_PASSWORD: sgt_ci_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd 'pg_isready -U sgt -d sgt_test'
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://sgt:sgt_ci_only@localhost:5432/sgt_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        id: install
        run: npm ci
      - name: Conventional Commits
        env:
          COMMIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMMIT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: sh scripts/check-commits.sh
      - name: Initialize test database
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/001_catalog.sql
      - name: Static analysis and formatting
        run: make lint
      - name: Unit and PostgreSQL integration tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make test
      - name: Collect quality metrics
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          METRICS_STAGE: ${{ inputs.stage || '' }}
        run: make metrics
      - name: Build application
        run: |
          make build
          tar -czf dist/sgt-linux-amd64.tar.gz -C dist api web -C .. db docs README.md
      - name: Upload test reports and metrics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: quality-${{ inputs.stage || 'current' }}-${{ github.run_number }}
          path: artifacts/
          retention-days: 90
          if-no-files-found: error
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: sgt-build
          path: dist/sgt-linux-amd64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sgt-build
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" sgt-linux-amd64.tar.gz --verify-tag --title "$RELEASE_TAG — учебный срез SGT" --generate-notes --prerelease
